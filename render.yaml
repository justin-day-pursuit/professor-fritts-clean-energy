services:
  - type: web
    name: professor-fritts-backend
    runtime: python
    rootDir: backend
    healthCheckPath: "/health"
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    buildCommand: "./build.sh"
    startCommand: "uvicorn fritts.asgi:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: TOOL_MODE
        value: "mock"
      - key: LLM_PROVIDER
        value: "scripted"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
